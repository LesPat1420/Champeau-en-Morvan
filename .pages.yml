# Configuration de l'interface d'édition Pages CMS (https://pagescms.org)
# Connexion : https://pagescms.org  ->  Sign in with GitHub  ->  autoriser ce dépôt.

media:
  input: src/assets/img/uploads
  output: /assets/img/uploads
  extensions: [jpg, jpeg, png, gif, webp, svg, pdf]

content:
  # ------------------------------------------------------------------
  - name: actualites
    label: Actualités
    type: collection
    path: src/actualites
    filename: "{fields.date | date('YYYY-MM-DD')}-{fields.title | slugify}.md"
    exclude: [index.njk, flux.njk, actualites.json]
    view:
      fields: [title, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Titre, type: string, required: true }
      - { name: date, label: Date, type: date, required: true, options: { format: "yyyy-MM-dd" } }
      - { name: chapo, label: "Résumé (1 à 2 phrases)", type: text }
      - { name: image, label: Image de une, type: image }
      - { name: imageAlt, label: Description de l'image, type: string }
      - { name: imageLegende, label: Légende de l'image, type: string }
      - { name: body, label: Contenu, type: rich-text }

  # ------------------------------------------------------------------
  - name: comptes_rendus
    label: Comptes rendus du conseil
    type: collection
    path: src/mairie/comptes-rendus
    filename: "{fields.dateSeance | date('YYYY-MM-DD')}-conseil.md"
    exclude: [index.njk]
    view:
      fields: [title, dateSeance]
      default: { sort: dateSeance, order: desc }
    fields:
      - { name: title, label: Intitulé, type: string, required: true }
      - { name: dateSeance, label: Date de la séance, type: date, required: true }
      - { name: document, label: Document (PDF), type: file, required: true }
      - { name: annexe, label: "Annexe (PDF, facultatif)", type: file }
      - { name: permalink, label: "(ne pas modifier)", type: string, hidden: true }

  # ------------------------------------------------------------------
  - name: bulletins
    label: Bulletins municipaux
    type: collection
    path: src/mairie/bulletins
    filename: "{fields.dateParution | date('YYYY-MM')}-bulletin.md"
    exclude: [index.njk]
    view:
      fields: [title, dateParution]
      default: { sort: dateParution, order: desc }
    fields:
      - { name: title, label: Titre, type: string, required: true }
      - { name: dateParution, label: Date de parution, type: date, required: true }
      - { name: document, label: Document (PDF), type: file, required: true }
      - { name: permalink, label: "(ne pas modifier)", type: string, hidden: true }

  # ------------------------------------------------------------------
  - name: alerte
    label: Bandeau d'alerte
    type: file
    path: src/_data/alerte.json
    fields:
      - { name: active, label: Afficher le bandeau, type: boolean, default: false }
      - { name: titre, label: "Titre (en gras)", type: string }
      - { name: message, label: Message, type: text }
      - { name: lien, label: "Lien « En savoir plus » (facultatif)", type: string }

  # ------------------------------------------------------------------
  - name: accueil
    label: Page d'accueil
    type: file
    path: src/_data/accueil.json
    fields:
      - { name: heroSurTitre, label: Sur-titre, type: string }
      - { name: heroTitre, label: Titre principal, type: string }
      - { name: heroAccroche, label: Phrase d'accroche, type: text }
      - name: diapos
        label: Images du bandeau (diaporama)
        type: object
        list: true
        fields:
          - { name: image, label: Image, type: image }
          - { name: alt, label: Description, type: string }
      - name: accesRapides
        label: Accès rapides
        type: object
        list: true
        fields:
          - { name: icone, label: "Icône (emoji)", type: string }
          - { name: titre, label: Titre, type: string }
          - { name: desc, label: Description, type: string }
          - { name: url, label: Lien, type: string }

  # ------------------------------------------------------------------
  - name: dechetterie
    label: Déchèterie (horaires et infos)
    type: file
    path: src/_data/dechetterie.json
    description: "Le site affiche automatiquement la période en cours et l'état ouvert/fermé."
    fields:
      - { name: gestionnaire, label: Gestionnaire, type: string }
      - { name: telephone, label: "Téléphone (affiché)", type: string }
      - { name: telephoneLien, label: "Téléphone (format +33…)", type: string }
      - { name: site, label: Site web, type: string }
      - { name: pageHoraires, label: Page source des horaires, type: string }
      - { name: verifieLe, label: Horaires vérifiés le, type: date }
      - name: sites
        label: Sites
        type: object
        list: true
        fields:
          - { name: nom, label: Nom, type: string }
          - { name: acces, label: Accès / adresse, type: text }
      - name: saisons
        label: Saisons
        type: object
        list: true
        fields:
          - { name: id, label: "Identifiant (ete / hiver)", type: string }
          - { name: libelle, label: Libellé, type: string }
          - { name: periode, label: "Période (texte affiché)", type: string }
          - { name: debut, label: "Début (MM-JJ)", type: string }
          - { name: fin, label: "Fin (MM-JJ)", type: string }
          - { name: jours, label: "Horaires par jour (JSON)", type: text }
      - name: acces
        label: Conditions d'accès
        type: object
        fields:
          - { name: particuliers, label: Particuliers, type: text }
          - { name: exterieurs, label: Extérieurs, type: text }
          - { name: professionnels, label: Professionnels, type: text }
      - { name: acceptes, label: Déchets acceptés, type: text }
      - { name: refuses, label: Déchets refusés, type: text }
      - { name: ressourcerie, label: Réemploi / ressourcerie, type: text }

  # ------------------------------------------------------------------
  - name: coordonnees
    label: Coordonnées de la mairie
    type: file
    path: src/_data/site.json
    fields:
      - { name: nom, label: Nom court, type: string, hidden: true }
      - { name: nomLong, label: Nom complet, type: string, hidden: true }
      - { name: codePostal, label: Code postal, type: string, hidden: true }
      - { name: departement, label: Département, type: string, hidden: true }
      - { name: region, label: Région, type: string, hidden: true }
      - { name: url, label: Adresse du site, type: string, hidden: true }
      - { name: langue, label: Langue, type: string, hidden: true }
      - { name: description, label: "Description (référencement)", type: text }
      - name: mairie
        label: Mairie
        type: object
        fields:
          - { name: adresse, label: Adresse, type: string }
          - { name: codePostalVille, label: Code postal et ville, type: string }
          - { name: telephone, label: "Téléphone (affiché)", type: string }
          - { name: telephoneLien, label: "Téléphone (format +33…)", type: string }
          - { name: email, label: Courriel, type: string }
          - { name: horaires, label: Note sur les horaires, type: string }
          - { name: maire, label: Maire, type: string }
          - { name: mandat, label: Mandat, type: string }
      - name: geo
        label: Coordonnées GPS
        type: object
        fields:
          - { name: lat, label: Latitude, type: number }
          - { name: lon, label: Longitude, type: number }

  # ------------------------------------------------------------------
  # Pages de contenu éditables individuellement (texte libre).
  - name: page_histoire
    label: "Page : Histoire & patrimoine"
    type: file
    path: src/histoire/index.md
    fields:
      - { name: title, label: Titre, type: string }
      - { name: chapo, label: Chapô, type: text }
      - { name: layout, label: "(ne pas modifier)", type: string, hidden: true }
      - { name: permalink, label: "(ne pas modifier)", type: string, hidden: true }
      - { name: body, label: Contenu, type: rich-text }

  - name: page_commune
    label: "Page : La commune"
    type: file
    path: src/la-commune/index.md
    fields:
      - { name: title, label: Titre, type: string }
      - { name: chapo, label: Chapô, type: text }
      - { name: layout, label: "(ne pas modifier)", type: string, hidden: true }
      - { name: permalink, label: "(ne pas modifier)", type: string, hidden: true }
      - { name: body, label: Contenu, type: rich-text }

  - name: page_vie_associative
    label: "Page : Vie associative"
    type: file
    path: src/vie-de-la-commune/vie-associative.md
    fields:
      - { name: title, label: Titre, type: string }
      - { name: chapo, label: Chapô, type: text }
      - { name: layout, label: "(ne pas modifier)", type: string, hidden: true }
      - { name: permalink, label: "(ne pas modifier)", type: string, hidden: true }
      - { name: fil, label: "(ne pas modifier)", type: string, hidden: true }
      - { name: body, label: Contenu, type: rich-text }

  - name: page_activites
    label: "Page : Activités économiques"
    type: file
    path: src/vie-de-la-commune/activites-economiques.md
    fields:
      - { name: title, label: Titre, type: string }
      - { name: chapo, label: Chapô, type: text }
      - { name: layout, label: "(ne pas modifier)", type: string, hidden: true }
      - { name: permalink, label: "(ne pas modifier)", type: string, hidden: true }
      - { name: fil, label: "(ne pas modifier)", type: string, hidden: true }
      - { name: body, label: Contenu, type: rich-text }

  - name: page_objets_trouves
    label: "Page : Objets trouvés"
    type: file
    path: src/pratique/objets-trouves.md
    fields:
      - { name: title, label: Titre, type: string }
      - { name: layout, label: "(ne pas modifier)", type: string, hidden: true }
      - { name: permalink, label: "(ne pas modifier)", type: string, hidden: true }
      - { name: body, label: Contenu, type: rich-text }
